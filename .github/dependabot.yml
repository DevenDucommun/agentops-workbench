version: 2
updates:
  # bun.lock is the lockfile, so use the bun ecosystem: the npm ecosystem
  # cannot update bun.lock and leaves CI's --frozen-lockfile install failing.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
