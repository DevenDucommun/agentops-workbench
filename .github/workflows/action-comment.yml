name: Action PR comment

# Hosted check of the Action's opt-in sticky comment (T2.6, #157): the first
# run creates one comment, the second updates that same comment in place.
# Opt-in per pull request with the `action-comment-test` label, because it
# writes to the pull request. Pull requests from forks are skipped: their
# token cannot write.
#
# The Action finds its comment by a marker that every gate comment shares, so
# this test refuses to run on a pull request that has a gate comment from any
# other run. It tags a comment only when the Action reports that this job's
# first run created it (output `comment-action`), and removes only tagged
# comments on a re-run. A comment from another run that appears mid-test is
# updated by the Action, never created, so the test fails without tagging it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: action-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sticky-comment:
    name: Sticky comment is created, then updated
    if: >-
      contains(github.event.pull_request.labels.*.name, 'action-comment-test') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GATE_MARKER: "<!-- agentops-gate -->"
      TEST_MARKER: "<!-- agentops-action-comment-test -->"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start from a pull request with no gate comment
        run: |
          list_gate_comments() {
            # A failed request stops the job: an empty list must mean no comments.
            if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.body | startswith(env.GATE_MARKER)) | {id, own: (.user.login == "github-actions[bot]" and (.body | contains(env.TEST_MARKER)))}' \
              > "$RUNNER_TEMP/gate-comments.jsonl"; then
              echo "::error::Could not list the pull request's comments."
              exit 1
            fi
          }
          list_gate_comments
          if jq -e 'select(.own | not)' "$RUNNER_TEMP/gate-comments.jsonl" > /dev/null; then
            echo "::error::This pull request has a gate comment from another run. The Action would overwrite it. Run this test on a pull request without one."
            exit 1
          fi
          for id in $(jq -r 'select(.own) | .id' "$RUNNER_TEMP/gate-comments.jsonl"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done
          list_gate_comments
          test ! -s "$RUNNER_TEMP/gate-comments.jsonl"

      - name: First run creates the comment
        id: first
        uses: ./
        with:
          agentops-path: ./bin/agentops
          artifact: fixtures/codex-exec-session.jsonl
          comment: "true"
          fail-on-gate: "false"

      - name: Assert one comment with the first result
        env:
          FIRST_ID: ${{ steps.first.outputs.comment-id }}
          FIRST_ACTION: ${{ steps.first.outputs.comment-action }}
        run: |
          # This run must have created the comment itself. If another run's
          # comment appeared after the empty-start check, the Action updated
          # that one instead: stop here, before this test tags anything.
          if [ "$FIRST_ACTION" != created ]; then
            echo "::error::The first run ${FIRST_ACTION:-did not report} a comment instead of creating one. Another run may be writing gate comments on this pull request."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith(env.GATE_MARKER))]' > "$RUNNER_TEMP/first.json"
          test "$(jq -s 'add | length' "$RUNNER_TEMP/first.json")" = 1
          jq -rs 'add | .[0].id' "$RUNNER_TEMP/first.json" > "$RUNNER_TEMP/comment-id"
          test "$(cat "$RUNNER_TEMP/comment-id")" = "$FIRST_ID"
          jq -rs 'add | .[0].user.login' "$RUNNER_TEMP/first.json" | grep -qx 'github-actions\[bot\]'
          body="$(jq -rs 'add | .[0].body' "$RUNNER_TEMP/first.json")"
          grep -q 'Session: .codex-exec-sample.$' <<< "$body"
          grep -q 'PASSED' <<< "$body"

      - name: Second run updates the same comment
        id: second
        uses: ./
        with:
          agentops-path: ./bin/agentops
          artifact: fixtures/risky-session.jsonl
          comment: "true"
          fail-on-gate: "false"

      - name: Assert the same comment now holds the second result
        env:
          SECOND_ID: ${{ steps.second.outputs.comment-id }}
          SECOND_ACTION: ${{ steps.second.outputs.comment-action }}
        run: |
          test "$SECOND_ACTION" = updated
          test "$SECOND_ID" = "$(cat "$RUNNER_TEMP/comment-id")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith(env.GATE_MARKER))]' > "$RUNNER_TEMP/second.json"
          test "$(jq -s 'add | length' "$RUNNER_TEMP/second.json")" = 1
          test "$(jq -rs 'add | .[0].id' "$RUNNER_TEMP/second.json")" = "$(cat "$RUNNER_TEMP/comment-id")"
          body="$(jq -rs 'add | .[0].body' "$RUNNER_TEMP/second.json")"
          grep -q 'Session: .risky-session.$' <<< "$body"
          grep -q 'FAILED' <<< "$body"
          if grep -q 'codex-exec-sample' <<< "$body"; then echo "::error::The first result is still in the comment."; exit 1; fi
          echo "Comment $(cat "$RUNNER_TEMP/comment-id") was created, then updated in place."

      - name: Tag the test comment as this workflow's
        run: |
          id="$(cat "$RUNNER_TEMP/comment-id")"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body > "$RUNNER_TEMP/body.md"
          printf '\n%s\n' "$TEST_MARKER" >> "$RUNNER_TEMP/body.md"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
