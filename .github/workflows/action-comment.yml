name: Action PR comment

# Hosted check of the Action's opt-in sticky comment (T2.6, #157): the first
# run creates one comment, the second updates that same comment in place.
# Opt-in per pull request with the `action-comment-test` label, because it
# writes to the pull request. Pull requests from forks are skipped: their
# token cannot write.
#
# The test runs the Action with a `comment-key` unique to this run and attempt,
# so it only ever creates, updates and deletes its own comment. Gate comments
# from other runs (the default comment or other keys) are never matched, and
# the test checks that they are left unchanged.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  sticky-comment:
    name: Sticky comment is created, then updated
    if: >-
      contains(github.event.pull_request.labels.*.name, 'action-comment-test') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      COMMENT_KEY: action-comment-test-${{ github.run_id }}-${{ github.run_attempt }}
      MARKER: "<!-- agentops-gate:action-comment-test-${{ github.run_id }}-${{ github.run_attempt }} -->"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record the other gate comments
        run: |
          # Every gate comment that is not this run's: they must be untouched at the end.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select((.body | startswith("<!-- agentops-gate")) and (.body | startswith(env.MARKER) | not)) | {id, updated_at}' \
            > "$RUNNER_TEMP/others-before.jsonl"
          echo "Other gate comments: $(wc -l < "$RUNNER_TEMP/others-before.jsonl")"

      - name: First run creates the comment
        id: first
        uses: ./
        with:
          agentops-path: ./bin/agentops
          artifact: fixtures/codex-exec-session.jsonl
          comment: "true"
          comment-key: ${{ env.COMMENT_KEY }}
          fail-on-gate: "false"

      - name: Assert one comment with the first result
        env:
          FIRST_ID: ${{ steps.first.outputs.comment-id }}
          FIRST_ACTION: ${{ steps.first.outputs.comment-action }}
        run: |
          test "$FIRST_ACTION" = created
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith(env.MARKER))]' > "$RUNNER_TEMP/first.json"
          test "$(jq -s 'add | length' "$RUNNER_TEMP/first.json")" = 1
          test "$(jq -rs 'add | .[0].id' "$RUNNER_TEMP/first.json")" = "$FIRST_ID"
          jq -rs 'add | .[0].user.login' "$RUNNER_TEMP/first.json" | grep -qx 'github-actions\[bot\]'
          body="$(jq -rs 'add | .[0].body' "$RUNNER_TEMP/first.json")"
          grep -q 'Session: .codex-exec-sample.$' <<< "$body"
          grep -q 'PASSED' <<< "$body"

      - name: Second run updates the same comment
        id: second
        uses: ./
        with:
          agentops-path: ./bin/agentops
          artifact: fixtures/risky-session.jsonl
          comment: "true"
          comment-key: ${{ env.COMMENT_KEY }}
          fail-on-gate: "false"

      - name: Assert the same comment now holds the second result
        env:
          FIRST_ID: ${{ steps.first.outputs.comment-id }}
          SECOND_ID: ${{ steps.second.outputs.comment-id }}
          SECOND_ACTION: ${{ steps.second.outputs.comment-action }}
        run: |
          test "$SECOND_ACTION" = updated
          test "$SECOND_ID" = "$FIRST_ID"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith(env.MARKER))]' > "$RUNNER_TEMP/second.json"
          test "$(jq -s 'add | length' "$RUNNER_TEMP/second.json")" = 1
          test "$(jq -rs 'add | .[0].id' "$RUNNER_TEMP/second.json")" = "$FIRST_ID"
          body="$(jq -rs 'add | .[0].body' "$RUNNER_TEMP/second.json")"
          grep -q 'Session: .risky-session.$' <<< "$body"
          grep -q 'FAILED' <<< "$body"
          if grep -q 'codex-exec-sample' <<< "$body"; then echo "::error::The first result is still in the comment."; exit 1; fi
          echo "Comment $FIRST_ID was created, then updated in place."

      - name: Other gate comments are unchanged
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select((.body | startswith("<!-- agentops-gate")) and (.body | startswith(env.MARKER) | not)) | {id, updated_at}' \
            > "$RUNNER_TEMP/others-after.jsonl"
          if ! diff "$RUNNER_TEMP/others-before.jsonl" "$RUNNER_TEMP/others-after.jsonl"; then
            echo "::error::Another gate comment changed during the test. If another run wrote it at the same time, re-run; otherwise the keyed comment is not isolated."
            exit 1
          fi

      - name: Remove this run's comment
        if: always() && steps.first.outputs.comment-id != ''
        env:
          ID: ${{ steps.first.outputs.comment-id }}
        run: |
          # Delete only this run's keyed comment, after confirming its marker.
          if gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ID" --jq '.body | startswith(env.MARKER)' | grep -qx true; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$ID"
          fi
